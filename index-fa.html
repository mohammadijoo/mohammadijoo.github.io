<body dir="rtl">
  <div class="fa-loader" id="faLoader" role="status" aria-live="polite">
    <div class="fa-loader-card">
      <strong>در حال بارگذاری نسخه فارسی پورتفولیو…</strong>
    </div>
  </div>

  <noscript>
    <div class="fa-loader">
      <div class="fa-loader-card">برای نمایش نسخه فارسی، JavaScript باید در مرورگر فعال باشد.</div>
    </div>
  </noscript>

  <script>
    (async () => {
      const loader = document.getElementById("faLoader");

      try {
        const response = await fetch("index.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const source = await response.text();
        const english = new DOMParser().parseFromString(source, "text/html");

        // Copy the current page-only inline styles from index.html. This is what
        // keeps index-fa.html visually identical even if the English page's
        // inline course/skill styling changes later.
        english.head.querySelectorAll("style").forEach((styleNode) => {
          const clone = document.createElement("style");
          clone.setAttribute("data-mirrored-from", "index.html");
          clone.textContent = styleNode.textContent;
          document.head.appendChild(clone);
        });

        // Keep the RTL stylesheet last so direction/font overrides win over any
        // mirrored page-only rules.
        const rtlStyles = document.getElementById("persian-rtl-styles");
        if (rtlStyles) document.head.appendChild(rtlStyles);

        // Script tags copied through innerHTML do not execute, but removing them
        // explicitly avoids duplicate script markup and makes execution order
        // deterministic below.
        english.body.querySelectorAll("script").forEach((script) => script.remove());

        document.body.className = english.body.className;
        document.body.innerHTML = english.body.innerHTML;
        document.body.dir = "rtl";
        document.documentElement.lang = "fa";
        document.documentElement.dir = "rtl";

        // Load the same behavior file used by English. After it registers its
        // DOMContentLoaded handler, dispatch the event because this mirror was
        // assembled asynchronously after the browser's original DOM ready event.
        const mainScript = document.createElement("script");
        mainScript.src = "js/main.js";
        mainScript.onload = () => {
          document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true }));
          window.dispatchEvent(new Event("load"));

          const faScript = document.createElement("script");
          faScript.src = "js/fa-localize.js";
          faScript.onload = () => {
            if (typeof window.localizePortfolioToPersian === "function") {
              window.localizePortfolioToPersian(document.body);
            }
          };
          document.body.appendChild(faScript);
        };
        document.body.appendChild(mainScript);
      } catch (error) {
        if (loader) {
          loader.innerHTML = `
            <div class="fa-loader-card">
              <strong>نسخه فارسی در حالت فایل محلی قابل بارگذاری نیست.</strong>
              <p>این صفحه را از طریق GitHub Pages یا یک وب‌سرور محلی باز کنید. برای نمونه، در پوشه سایت دستور <code dir="ltr">python -m http.server 8000</code> را اجرا کنید.</p>
            </div>`;
        }
        console.error("Unable to mirror index.html for the Persian portfolio:", error);
      }
    })();
  </script>
