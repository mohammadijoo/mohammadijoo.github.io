  <script>
    (async () => {
      // Bump this revision (and the English main.js URL) when deploying JS changes.
      const revision = "20261117-1";
      const timeoutMs = 8000;
      const root = document.documentElement;
      root.dataset.faStatus = "loading";

      function loadScript(path) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = path + "?v=" + encodeURIComponent(revision);
          script.dataset.manualInit = "true";
          let timer;
          function finish(error) {
            clearTimeout(timer);
            script.onload = script.onerror = null;
            if (error) {
              script.remove();
              reject(error);
            } else {
              resolve();
            }
          }
          script.onload = () => finish();
          script.onerror = () => finish(new Error("Unable to load " + path));
          timer = setTimeout(() => finish(new Error("Timeout loading " + path)), timeoutMs);
          document.head.appendChild(script);
        });
      }

      function showNotice(message, fatal) {
        const notice = document.createElement("div");
        notice.id = "faLocalizationNotice";
        notice.lang = "fa";
        notice.dir = "rtl";
        notice.setAttribute("role", fatal ? "alert" : "status");
        notice.className = "fa-localization-notice";
        const detail = document.createElement("p");
        detail.textContent = message;
        const retry = document.createElement("a");
        retry.href = "index-fa.html";
        retry.textContent = "تلاش مجدد";
        const english = document.createElement("a");
        english.href = "index.html";
        english.textContent = "نسخه انگلیسی";
        notice.append(detail, retry, document.createTextNode(" | "), english);
        const old = document.getElementById(notice.id);
        if (old) old.replaceWith(notice);
        else {
          const loader = document.getElementById("faLoader");
          if (loader) loader.replaceWith(notice);
          else (document.querySelector("main") || document.body).prepend(notice);
        }
      }

      function applyPersianDetails() {
    // Use the Persian CV on the Persian portfolio page.
    const persianResumeLink = document.querySelector("a.resume-link");
    if (persianResumeLink) {
      persianResumeLink.href = "files/CV_Abolfazl_Mohammadijoo_FA.pdf";
    }


    // Localize the new grouped skill labels introduced in index.html.
    const groupedSkillTranslations = {
          "Classical Control / PID / Lead-Lag": "کنترل کلاسیک / PID / جبران‌ساز پیش‌فاز-پس‌فاز",
          "State-Space / Observers / Pole Placement": "فضای حالت / ناظرها / جایابی قطب",
          "Optimal Control / LQR / LQG": "کنترل بهینه / LQR / LQG",
          "Robust / Nonlinear / Sliding Mode Control": "کنترل مقاوم / غیرخطی / مد لغزشی",
          "Adaptive Control / MPC": "کنترل تطبیقی / MPC",
          "System Identification / Kalman Filtering / Sensor Fusion": "شناسایی سیستم / فیلتر کالمن / همجوشی حسگرها",
          "Robot Kinematics / Dynamics": "سینماتیک / دینامیک ربات",
          "AUV / ROV / Underwater Robotics": "AUV / ROV / رباتیک زیرآبی",
          "Trajectory Planning / Motion Planning": "برنامه‌ریزی مسیر حرکت / برنامه‌ریزی حرکت",
          "Manipulator / Mobile Robot Control": "کنترل بازوی رباتیکی / ربات متحرک",
          "SLAM / Localization / Navigation": "SLAM / مکان‌یابی / ناوبری",
          "ROS / ROS 2 / Gazebo / Robotics Simulation": "ROS / ROS 2 / Gazebo / شبیه‌سازی رباتیک",
          "Embedded / Real-Time / Mechatronic Control": "کنترل نهفته / بلادرنگ / مکاترونیک",
          "Statistics / SPSS": "آمار / SPSS",
          "Machine Learning / Scikit-Learn": "یادگیری ماشین / Scikit-Learn",
          "Neural Networks / Deep Learning / TensorFlow / Keras / PyTorch": "شبکه‌های عصبی / یادگیری عمیق / TensorFlow / Keras / PyTorch",
          "Computer Vision / Convolutional Networks / OpenCV": "بینایی ماشین / شبکه‌های کانولوشنی / OpenCV",
          "Natural Language Processing / Large Language Models / BERTopic": "پردازش زبان طبیعی / مدل‌های زبانی بزرگ / BERTopic",
          "R Programming / ggplot / dplyr / caret / tidyverse": "برنامه‌نویسی R / ggplot / dplyr / caret / tidyverse",
          "System Administration / PowerShell": "مدیریت سیستم / PowerShell"
};
    document.querySelectorAll("#skills .skill-title > span:first-child").forEach((label) => {
      const sourceLabel = label.textContent.trim();
      const translatedLabel = groupedSkillTranslations[sourceLabel];
      if (translatedLabel) {
        label.textContent = translatedLabel;
      }
    });

    const controlCategoryHeading = Array.from(document.querySelectorAll("#skills .skill-category-card h3"))
      .find((heading) => heading.textContent.trim() === "Control Engineering & Robotics");
    if (controlCategoryHeading) {
      controlCategoryHeading.textContent = "مهندسی کنترل و رباتیک";
    }

    // Keep progress accessibility labels aligned with the visible Persian labels.
    document.querySelectorAll("#skills .skill-item").forEach((item) => {
      const label = item.querySelector(".skill-title > span:first-child");
      const progress = item.querySelector(".progress");
      if (label && progress) {
        progress.setAttribute("aria-label", `${label.textContent.trim()} — سطح مهارت`);
      }
    });

      }

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        let source;
        try {
          const response = await fetch("index.html", { cache: "no-store", signal: controller.signal });
          if (!response.ok) throw new Error("HTTP " + response.status);
          source = await response.text();
        } finally {
          clearTimeout(timer);
        }
        const english = new DOMParser().parseFromString(source, "text/html");
        if (!english.querySelector("#home .hero-content")) {
          throw new Error("Canonical portfolio markup missing");
        }

        english.head.querySelectorAll("style").forEach((styleNode) => {
          const clone = document.createElement("style");
          clone.setAttribute("data-mirrored-from", "index.html");
          clone.textContent = styleNode.textContent;
          document.head.appendChild(clone);
        });
        const rtlStyles = document.getElementById("persian-rtl-styles");
        if (rtlStyles) document.head.appendChild(rtlStyles);
        english.body.querySelectorAll("script").forEach((script) => script.remove());

        document.body.className = english.body.className;
        document.body.innerHTML = english.body.innerHTML;
        document.body.dir = "rtl";
        root.lang = "fa";
        root.dir = "rtl";

        // Scripts load independently, with a bounded wait. Initialize optional
        // project-card enhancements on English markup first, then translate once.
        // Do not dispatch synthetic DOMContentLoaded or window load events.
        const [behavior, localization] = await Promise.allSettled([
          loadScript("js/main.js"),
          loadScript("js/fa-localize.js")
        ]);
        let behaviorFailed = false;
        try {
          if (behavior.status === "rejected") throw behavior.reason;
          if (typeof window.initializePortfolio !== "function") {
            throw new Error("Portfolio initializer missing");
          }
          window.initializePortfolio();
        } catch (error) {
          behaviorFailed = true;
          console.warn("[portfolio-fa] Optional interactions failed:", error);
        }

        try {
          if (localization.status === "rejected") throw localization.reason;
          if (typeof window.localizePortfolioToPersian !== "function") {
            throw new Error("Persian localizer missing");
          }
          window.localizePortfolioToPersian(document.body);
          applyPersianDetails();
        } catch (error) {
          root.dataset.faStatus = "error";
          console.error("[portfolio-fa] Translation failed:", error);
          showNotice("ترجمه فارسی بارگذاری نشد. ممکن است بخشی از صفحه به انگلیسی نمایش داده شود.", true);
          return;
        }

        root.dataset.faStatus = behaviorFailed ? "degraded" : "ready";
        if (behaviorFailed) {
          showNotice("نسخه فارسی بارگذاری شد، اما برخی امکانات تعاملی در دسترس نیستند.", false);
        }
      } catch (error) {
        root.dataset.faStatus = "error";
        console.error("[portfolio-fa] Unable to load canonical portfolio:", error);
        showNotice("بارگذاری پورتفولیو ناموفق بود. لطفاً اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.", true);
      }
    })();
